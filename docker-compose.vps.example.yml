# Exemplo futuro para uma VPS. Não iniciar neste repositório sem preencher os
# segredos e o caminho externo da licença. O backend pode continuar como serviço
# systemd no host e usar MEDIA_S3_ENDPOINT=http://127.0.0.1:9000.
services:
  minio:
    image: quay.io/minio/aistor/minio:latest@sha256:107cf2014a9583c74c11e3cdbd6903d89c2244355886b89ce532f4ecae9c23f3
    restart: unless-stopped
    command: server /data --console-address ":9001" --license /minio.license
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER outside Git}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD outside Git}
    # Só o backend no host acessa o S3. A porta 9001 do console não é publicada.
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - mova-minio-vps-data:/data
      - ${MINIO_LICENSE_FILE:?Set absolute path to external minio.license}:/minio.license:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?Set media domain}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME email}
    volumes:
      - ./Caddyfile.vps.example:/etc/caddy/Caddyfile:ro
      - mova-caddy-data:/data
      - mova-caddy-config:/config

volumes:
  mova-minio-vps-data:
  mova-caddy-data:
  mova-caddy-config:
