name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # A cada 12 horas (00:00 e 12:00 UTC)
    - cron: "0 */12 * * *"

# Cancela execuções antigas do mesmo ref quando uma nova é disparada.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest
    environment: test

    env:
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      NODE_ENV: test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
      DIRECT_URL_TEST: ${{ secrets.DIRECT_URL_TEST }}
      LOCALIZACAO_SIMULADOR: ${{ secrets.LOCALIZACAO_SIMULADOR }}
      LOCALIZACAO_SIMULADOR_INTERVALO_MS: ${{ secrets.LOCALIZACAO_SIMULADOR_INTERVALO_MS }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SEND_REAL_EMAIL: ${{ secrets.SEND_REAL_EMAIL }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      BODY_LIMIT: ${{ secrets.BODY_LIMIT }}
      RATE_LIMIT_WINDOW_MS: ${{ secrets.RATE_LIMIT_WINDOW_MS }}
      RATE_LIMIT_AUTH_MAX: ${{ secrets.RATE_LIMIT_AUTH_MAX }}
      RATE_LIMIT_WRITE_MAX: ${{ secrets.RATE_LIMIT_WRITE_MAX }}
      MONITORAMENTO_VEICULOS: ${{ secrets.MONITORAMENTO_VEICULOS }}
      MONITORAMENTO_INTERVALO_MS: ${{ secrets.MONITORAMENTO_INTERVALO_MS }}
      MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      ASAAS_WEBHOOK_SECRET: ${{ secrets.ASAAS_WEBHOOK_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm run test

      - name: List report files
        if: always()
        run: ls -R reports || true
        
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: reports/vitest.xml
          if-no-files-found: warn

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Vitest Tests
          path: reports/vitest.xml
          reporter: java-junit
