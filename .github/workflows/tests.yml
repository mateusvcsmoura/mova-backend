name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo ref quando uma nova é disparada.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest
    environment: test

    # Postgres efemero do proprio job: o CI nao toca em nenhum banco externo.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mova
          POSTGRES_PASSWORD: mova
          POSTGRES_DB: mova_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mova -d mova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      minio:
        image: bitnamilegacy/minio:2025.7.23
        env:
          MINIO_ROOT_USER: movaci
          MINIO_ROOT_PASSWORD: movaci-secret
          MINIO_DEFAULT_BUCKETS: mova-media-private,mova-media-public:download
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/minio/health/ready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
      DIRECT_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      NODE_ENV: ${{ secrets.NODE_ENV }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
      LOCALIZACAO_SIMULADOR: ${{ secrets.LOCALIZACAO_SIMULADOR }}
      LOCALIZACAO_SIMULADOR_INTERVALO_MS: ${{ secrets.LOCALIZACAO_SIMULADOR_INTERVALO_MS }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SEND_REAL_EMAIL: "false"
      MOVA_VITEST_ALLURE: "1"
      MEDIA_S3_ENDPOINT: ${{ secrets.MEDIA_S3_ENDPOINT }}
      MEDIA_PUBLIC_BASE_URL: ${{ secrets.MEDIA_PUBLIC_BASE_URL }}
      MEDIA_S3_ACCESS_KEY_ID: ${{ secrets.MEDIA_S3_ACCESS_KEY_ID }}
      MEDIA_S3_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_S3_SECRET_ACCESS_KEY }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      BODY_LIMIT: ${{ secrets.BODY_LIMIT }}
      RATE_LIMIT_WINDOW_MS: ${{ secrets.RATE_LIMIT_WINDOW_MS }}
      RATE_LIMIT_AUTH_MAX: ${{ secrets.RATE_LIMIT_AUTH_MAX }}
      RATE_LIMIT_WRITE_MAX: ${{ secrets.RATE_LIMIT_WRITE_MAX }}
      MONITORAMENTO_VEICULOS: ${{ secrets.MONITORAMENTO_VEICULOS }}
      MONITORAMENTO_INTERVALO_MS: ${{ secrets.MONITORAMENTO_INTERVALO_MS }}
      MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      ASAAS_WEBHOOK_SECRET: ${{ secrets.ASAAS_WEBHOOK_SECRET }}
      DESBLOQUEIO_RAIO_METROS: ${{ secrets.DESBLOQUEIO_RAIO_METROS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations (test database)
        run: npm run db:migrate:test

      - name: Run tests
        run: npm run test

      - name: Debug generated files
        if: always()
        run: |
          pwd
          find . -type f | sort
      
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/vitest.xml
          if-no-files-found: warn

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn

      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Vitest Tests
          path: reports/vitest.xml
          reporter: java-junit
  allure:
    name: Generate Allure Report
    needs: test
    if: always()
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report

      - name: Upload Allure HTML
        uses: actions/upload-artifact@v4
        with:
          name: allure-html
          path: allure-report

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4