# Postgres local para desenvolvimento e testes do MOVA.
# Ver auditoria/AMBIENTES.md.
#
#   npm run db:up      sobe o banco
#   npm run db:down    derruba (mantendo os dados)
#
# Porta 5433 de proposito, para nao colidir com um Postgres ja instalado na 5432.
services:
  postgres:
    image: postgres:16-alpine
    container_name: mova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mova
      POSTGRES_PASSWORD: mova
      POSTGRES_DB: mova_dev
    ports:
      - "5433:5432"
    volumes:
      - mova-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mova -d mova_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  mova-pgdata:
